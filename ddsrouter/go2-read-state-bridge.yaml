# Read-only Go2 DDS bridge for the README connection tests.
#
# Go2 internal DDS: 192.168.123.18 / domain 0
# Go2 Ubuntu Wi-Fi: 192.168.8.252 / domain 42
#
# The Wi-Fi participant is pinned to its current address because this Go2 has
# multiple NICs. Update it if DHCP changes the Ubuntu WLAN address. No command
# topic is forwarded.

version: v4.0

# Supplying the ROS 2 DDS type names also works with publishers that do not
# expose complete dynamic type information during discovery.
builtin-topics:
  - name: rt/sportmodestate
    type: unitree_go::msg::dds_::SportModeState_
  - name: rt/lf/sportmodestate
    type: unitree_go::msg::dds_::SportModeState_
  - name: rt/lowstate
    type: unitree_go::msg::dds_::LowState_
  - name: rt/lf/lowstate
    type: unitree_go::msg::dds_::LowState_
  - name: rt/wirelesscontroller
    type: unitree_go::msg::dds_::WirelessController_

allowlist:
  - name: rt/sportmodestate
  - name: rt/lf/sportmodestate
  - name: rt/lowstate
  - name: rt/lf/lowstate
  - name: rt/wirelesscontroller

participants:
  - name: go2_internal
    kind: local
    domain: 0
    transport: udp
    whitelist-interfaces:
      - "192.168.123.18"

  - name: go2_wifi
    kind: local
    domain: 42
    transport: udp
    whitelist-interfaces:
      - "192.168.8.252"
